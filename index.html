<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TenStock · Control de stock</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- ============ LOGIN ============ -->
  <section id="vista-login" class="login">
    <div class="login-marca">
      <img src="./img/logo.png" alt="Logo de TenStock" class="logo">
      <small>Desarrollado por TecnoNova®</small>
      <small>IFTS N° 4 - Analisis de Sistemas</small>
    </div>
    <form id="form-login" class="login-form" autocomplete="off">
      <h2>Ingresar</h2>
      <label>Usuario
        <input id="login-usuario" type="text" required autofocus>
      </label>
      <label>Contraseña
        <input id="login-pass" type="password" required>
      </label>
      <p id="login-error" class="error" role="alert"></p>
      <button class="btn btn-primario" type="submit">Ingresar</button>
    </form>
  </section>

  <!-- ============ APP ============ -->
  <section id="vista-app" hidden>
    <header class="barra">
      <strong class="logo">TenStock</strong>
      <nav class="tabs">
        <button class="tab activa" data-panel="panel-insumos">Insumos</button>
        <button class="tab" data-panel="panel-usuarios" id="tab-usuarios" hidden>Usuarios</button>
      </nav>
      <div class="sesion">
        <span id="sesion-info"></span>
        <button id="btn-salir" class="btn btn-texto">Salir</button>
      </div>
    </header>

    <main>
      <!-- INSUMOS -->
      <section id="panel-insumos" class="panel">
        <div class="herramientas">
          <input id="buscar" type="search" placeholder="Buscar por nombre, marca o SKU">
          <select id="filtro-categoria"><option value="">Todas las categorías</option></select>
          <button id="btn-nuevo-insumo" class="btn btn-primario" hidden>Agregar insumo</button>
        </div>
        <p id="msg-insumos" class="aviso" role="status"></p>
        <div class="tabla-wrap">
          <table>
            <thead>
              <tr><th>Nombre</th><th>Categoría</th><th>Marca</th><th>SKU</th><th class="num">Precio</th><th class="num">Stock</th><th>Acciones</th></tr>
            </thead>
            <tbody id="tbody-insumos"></tbody>
          </table>
        </div>
      </section>

      <!-- USUARIOS (solo admin) -->
      <section id="panel-usuarios" class="panel" hidden>
        <div class="herramientas">
          <h2>Usuarios del sistema</h2>
          <button id="btn-nuevo-usuario" class="btn btn-primario">Agregar usuario</button>
        </div>
        <div class="tabla-wrap">
          <table>
            <thead><tr><th>Usuario</th><th>Perfil</th><th>Campos que puede editar</th><th>Estado</th><th>Acciones</th></tr></thead>
            <tbody id="tbody-usuarios"></tbody>
          </table>
        </div>
      </section>
    </main>
  </section>

  <!-- ============ DIÁLOGOS ============ -->
  <dialog id="dlg-insumo">
    <form id="form-insumo" method="dialog">
      <h2 id="dlg-insumo-titulo">Insumo</h2>
      <label>Nombre <input id="f-nombre" required maxlength="120"></label>
      <label>Categoría <select id="f-categoria" required></select></label>
      <label>Marca <input id="f-marca" required maxlength="60"></label>
      <label>SKU <input id="f-sku" required maxlength="60"></label>
      <div class="fila">
        <label>Precio (ARS) <input id="f-precio" type="number" min="0" step="1" required></label>
        <label>Stock <input id="f-stock" type="number" min="0" step="1" required></label>
      </div>
      <p id="insumo-error" class="error" role="alert"></p>
      <div class="acciones-dlg">
        <button type="button" class="btn btn-texto" data-cerrar>Cancelar</button>
        <button type="submit" class="btn btn-primario">Guardar cambios</button>
      </div>
    </form>
  </dialog>

  <dialog id="dlg-venta">
    <form id="form-venta" method="dialog">
      <h2>Registrar venta</h2>
      <p id="venta-detalle"></p>
      <label>Cantidad vendida <input id="venta-cantidad" type="number" min="1" step="1" value="1" required></label>
      <p id="venta-error" class="error" role="alert"></p>
      <div class="acciones-dlg">
        <button type="button" class="btn btn-texto" data-cerrar>Cancelar</button>
        <button type="submit" class="btn btn-primario">Registrar venta</button>
      </div>
    </form>
  </dialog>

  <dialog id="dlg-usuario">
    <form id="form-usuario" method="dialog">
      <h2 id="dlg-usuario-titulo">Usuario</h2>
      <label>Usuario <input id="u-usuario" required maxlength="30" pattern="[a-zA-Z0-9_.]+" title="Letras, números, punto o guion bajo"></label>
      <label>Contraseña <input id="u-pass" type="password" minlength="6" autocomplete="new-password"></label>
      <small id="u-pass-ayuda"></small>
      <label>Perfil
        <select id="u-rol"><option value="usuario">Usuario (ventas / depósito)</option><option value="admin">Administrador</option></select>
      </label>
      <fieldset id="u-permisos">
        <legend>Campos que puede modificar</legend>
        <label class="check"><input type="checkbox" value="nombre"> Nombre</label>
        <label class="check"><input type="checkbox" value="categoria"> Categoría</label>
        <label class="check"><input type="checkbox" value="marca"> Marca</label>
        <label class="check"><input type="checkbox" value="precio"> Precio</label>
        <label class="check"><input type="checkbox" value="sku"> SKU</label>
        <label class="check"><input type="checkbox" value="stock"> Stock</label>
      </fieldset>
      <label class="check"><input id="u-activo" type="checkbox" checked> Usuario activo</label>
      <p id="usuario-error" class="error" role="alert"></p>
      <div class="acciones-dlg">
        <button type="button" class="btn btn-texto" data-cerrar>Cancelar</button>
        <button type="submit" class="btn btn-primario">Guardar usuario</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="js/app.js"></script>
  <!-- ============ para probar la demo de datos ============ -->
  <script type="module" src="js/carga-demo.js"></script>
</body>
</html>
